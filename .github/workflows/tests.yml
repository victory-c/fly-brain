# CPU tests on every pull request and push to main: the engine on hand-made networks, select/fetch on the
# synthetic brain, the bike, and the quickstart notebook. GPU and Brian2 tests skip. Sparse checkout: the
# 1.9 GB of fly_brain/results/ is not needed.
name: tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            fly_brain/brain
            fly_brain/bike
            fly_brain/runs
            fly_brain/tests
            notebooks
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt nbclient nbformat ipykernel
      - name: Test
        working-directory: fly_brain
        run: python -m pytest tests -q
